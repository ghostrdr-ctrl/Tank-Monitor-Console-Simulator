; The suite's own settings, and there is one of them, and it is load-bearing.
;
; `--capture=sys` instead of pytest's default `--capture=fd`.
;
; Every Tk test in this suite is guarded by a probe -- `tkinter.Tk().destroy()`
; at import, or a try/except round `SimApp(...)` in `setUpClass` -- that skips
; the file rather than failing it when there is no usable display. Under the
; default capture those probes fail INTERMITTENTLY on Windows, and when one
; does it takes its whole file with it: a run comes back "1197 passed, 96
; skipped" instead of "1291 passed, 2 skipped", with no failure and no clue.
; It reads like a broken Tcl installation. It is not.
;
; The default capture replaces file descriptors 1 and 2 at the OS level, and
; Tk on Windows wants a usable stdio handle while it initialises. `sys`
; capture replaces `sys.stdout` and `sys.stderr` in the interpreter and leaves
; the descriptors alone, and the probes then pass every time -- measured over
; a dozen runs each way: `--capture=fd` skipped the panel file in roughly one
; run in three, `--capture=sys` and `-s` in none.
;
; This matters more than a slow test would: a silent skip is coverage that
; goes away without saying so, which is exactly the shape FIDELITY V0 is
; about. CI runs `python -m unittest discover -s tests -q` and never reads
; this file; it is here for the local runs, where the flake was.
[pytest]
addopts = --capture=sys
